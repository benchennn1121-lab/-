<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>远程前置摄像头（链接版）</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
      padding: 16px;
      min-height: 100vh;
    }
    h2 { text-align: center; margin-bottom: 20px; font-size: 1.3rem; }
    .box {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      background: #0a84ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button.secondary { background: #333; }
    #localVideo, #remoteVideo {
      width: 100%;
      max-height: 45vh;
      background: #000;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }
    .status {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin: 12px 0;
      word-break: break-all;
    }
    .link-box {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      word-break: break-all;
      font-size: 14px;
      color: #0a84ff;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>远程前置摄像头</h2>
  <p class="status" id="status">请选择操作</p>

  <div class="box" id="mainBox">
    <button onclick="createRoom()">创建房间（生成链接）</button>
    <button class="secondary" onclick="location.reload()">刷新页面</button>
  </div>

  <div class="box hidden" id="linkBox">
    <p style="text-align:center; margin-bottom:8px;">把下面这个链接发给对方：</p>
    <div class="link-box" id="shareLink"></div>
    <button onclick="copyLink()">复制链接</button>
  </div>

  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>

  <script>
    let peer = null;
    let localStream = null;
    let currentCall = null;

    const statusEl = document.getElementById('status');
    const mainBox = document.getElementById('mainBox');
    const linkBox = document.getElementById('linkBox');
    const shareLinkEl = document.getElementById('shareLink');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    // 检查网址是否带有加入参数
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');

    if (joinId) {
      // 对方打开带参数的链接 → 自动开启摄像头并加入
      mainBox.classList.add('hidden');
      setStatus('正在开启摄像头并加入...');
      startAsJoiner(joinId);
    }

    // 创建房间（生成带参数的链接）
    function createRoom() {
      peer = new Peer();

      peer.on('open', (id) => {
        const link = window.location.origin + window.location.pathname + '?join=' + id;
        shareLinkEl.textContent = link;
        linkBox.classList.remove('hidden');
        mainBox.classList.add('hidden');
        setStatus('房间已创建，等待对方打开链接...');
      });

      peer.on('call', (call) => {
        setStatus('对方已加入，正在接收画面...');
        currentCall = call;
        call.answer(); // 只接收，不发送自己的画面

        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          remoteVideo.style.display = 'block';
          setStatus('已连接到对方前置摄像头');
        });

        call.on('close', () => {
          setStatus('对方已断开');
          remoteVideo.style.display = 'none';
        });
      });

      peer.on('error', (err) => {
        setStatus('错误: ' + err.type);
        console.error(err);
      });
    }

    // 作为加入方：开启前置摄像头并呼叫
    async function startAsJoiner(roomId) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        localVideo.srcObject = localStream;
        localVideo.style.display = 'block';
        setStatus('摄像头已开启，正在连接...');

        peer = new Peer();

        peer.on('open', () => {
          const call = peer.call(roomId, localStream);
          currentCall = call;

          call.on('close', () => {
            setStatus('连接已断开');
          });

          setStatus('已连接，正在发送前置摄像头画面');
        });

        peer.on('error', (err) => {
          setStatus('连接失败: ' + err.type);
          console.error(err);
        });

      } catch (err) {
        console.error(err);
        setStatus('无法开启摄像头，请检查权限');
        alert('请允许浏览器使用摄像头权限');
      }
    }

    function copyLink() {
      const text = shareLinkEl.textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('链接已复制，发给对方即可');
      }).catch(() => {
        // 备用方案
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('链接已复制，发给对方即可');
      });
    }

    window.addEventListener('beforeunload', () => {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
    });
  </script>
</body>
</html>
